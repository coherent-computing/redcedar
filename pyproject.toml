[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-quantum"
version = "0.1.0"
description = "Python client for Cascade Quantum ML server"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Coherent Computing"}]

dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["cascade_quantum*"]
