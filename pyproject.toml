[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redcedar"
version = "0.2.0"
description = "Python client for the Red Cedar quantum machine learning server"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Cascade Quantum"}]

dependencies = [
    "requests>=2.28",
]

[project.scripts]
redcedar = "redcedar.cli:main"

[project.optional-dependencies]
plotting = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["redcedar*"]
