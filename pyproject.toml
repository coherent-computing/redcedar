[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redcedar"
version = "2.0.0"
description = "Python client for the Red Cedar quantum machine learning server"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Cascade Quantum"}]
keywords = ["red cedar", "redcedar", "cascade quantum", "quantum", "quantum computing", "quantum machine learning", "qml", "machine learning", "classification", "explainable ai", "client", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/coherent-computing/redcedar"
Documentation = "https://coherent-computing.github.io/redcedar/"

[project.scripts]
redcedar = "redcedar.cli:main"

[project.optional-dependencies]
plotting = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["redcedar*"]
