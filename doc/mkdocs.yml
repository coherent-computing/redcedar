site_name: Red Cedar
site_url: https://coherent-computing.github.io/redcedar/
site_description: Documentation for redcedar, the Python SDK for Red Cedar, the quantum machine learning framework from Cascade Quantum. Install it with pip install redcedar.
site_author: Cascade Quantum

theme: mkdocs

extra_css:
    - css/custom.css

# The SDK version from pyproject.toml, in every page's footer and the About page
hooks:
    - hooks/version.py

nav:
    - Home: index.md
    - Quick Start: quick_start.md
    - User Guide: user_guide.md
    - Examples: examples.md
    - Releases: release_notes.md
    - PAL: known_issues.md
    - About: about.md
